# /etc/ionis-core/ionis-core.conf — this site's values.
#
# SHIPS WITH NO ASSIGNMENTS, deliberately. Sourced by /usr/bin/ionis-env, which
# every populate script reads. Absent or untouched, the built-in defaults apply and
# behaviour is exactly what it was before this file existed.
#
# WHY IT EXISTS. Sixteen populate scripts each carried CH_HOST="${CH_HOST:-192.168.1.90}"
# and one carried CH_HOST="192.168.1.90" with no override at all. That is one host's
# address shipped seventeen times in a package published on COPR, and a site that
# wanted to change it had seventeen files to edit. The default is now localhost, and
# a site sets its own here, once.
#
# Same mechanism and same reasoning as fleet-zfs-backup (KI7MT/fleet-ops#183): a
# packaged script must not carry one host's addresses and mount points as the only
# possible values.
#
# Precedence, highest first:
#   1. an explicit environment variable   CH_HOST=10.60.1.1 bash populate_*.sh
#   2. an assignment in this file
#   3. the built-in default in ionis-env
#
# Uncomment and set what applies. Values shown are this lab's, as an example.

# ClickHouse. CH_HOST is the name the populate scripts read.
#CH_HOST=10.60.1.1
#CLICKHOUSE_PORT=9000
#CLICKHOUSE_DB=wspr

# Source archives. On this host these live on archive-pool, which is backed up.
#WSPR_DATA_DIR=/mnt/wspr-data
#SOLAR_DATA_DIR=/mnt/solar-data

# Where trained model checkpoints live, for populate_training_runs.sh. It first
# looks for a sibling checkout; this is the fallback when there is none.
#IONIS_TRAINING_DIR=/mnt/ionis-models/versions

# Ingest tuning.
#INGEST_RAM_GB=64
#INGEST_WORKERS=16
